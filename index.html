*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{margin:0;padding:0;font-family:'Segoe UI',sans-serif;background:var(--bg-dark);color:#fff;overflow:hidden}
@media print{body{display:none!important}}

/* --- شاشة التحميل --- */
#loader{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:10000;transition:transform 1.2s cubic-bezier(1,0,0,1);perspective:1000px}
.welcome-container{position:relative;display:flex;align-items:center;justify-content:center;transition:opacity 1s}
.welcome-text{color:var(--gold);font-size:1.5rem;letter-spacing:5px;text-transform:uppercase;text-shadow:0 0 20px var(--gold-shadow)}
.nasr-orbit{position:absolute;font-weight:900;font-size:1.9rem;color:var(--gold);text-shadow:0 0 25px var(--gold);white-space:nowrap;opacity:0;animation:enter 1s ease-out .8s forwards,orbit 3s ease-in-out infinite 1.8s}
@keyframes enter{0%{opacity:0;transform:translateX(300px)}100%{opacity:1;transform:translateX(160px)}}
@keyframes orbit{0%{transform:rotateY(0) translateX(160px) rotateY(0) scale(1);opacity:1}50%{transform:rotateY(180deg) translateX(160px) rotateY(-180deg) scale(.4);opacity:.2;filter:blur(3px)}100%{transform:rotateY(360deg) translateX(160px) rotateY(-360deg) scale(1);opacity:1}}

/* --- الخلفية المتوهجة --- */
.glow-line{position:absolute;width:1px;height:100vh;background:linear-gradient(to bottom,transparent,var(--gold),transparent);opacity:0.15;animation:scan 6s linear infinite}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}

/* --- الكارت الرئيسي والتوهج --- */
.main-content{min-height:100vh;display:flex;align-items:center;justify-content:center;visibility:hidden;background:radial-gradient(circle at center,#0a111a 0%,#02050a 100%);transition:filter .5s}
.glass-card{position:relative;background:rgba(255,255,255,.02);border:1px solid rgba(255,215,0,.2);backdrop-filter:blur(20px);border-radius:40px;padding:60px 40px;width:90%;max-width:440px;text-align:center;box-shadow:0 0 50px rgba(0,0,0,0.5), 0 0 20px var(--gold-shadow);transform:scale(.9);opacity:0;transition:1.2s cubic-bezier(.4,0,.2,1)}

h1{font-size:4.2rem;margin:0;background:linear-gradient(to bottom,#fff,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:12px;text-transform:uppercase;animation:tGlow 2s ease-in-out infinite alternate}
@keyframes tGlow{from{filter:drop-shadow(0 0 5px var(--gold-shadow))}to{filter:drop-shadow(0 0 15px var(--gold))}}

.arabic-name{font-size:1.3rem;color:#666;letter-spacing:10px;margin-top:-10px;margin-bottom:40px}
.service-row{margin-bottom:25px;text-align:right;direction:rtl}
.en-tag{color:var(--gold);font-size:.75rem;font-weight:800;display:block;letter-spacing:1.5px;text-shadow:0 0 5px var(--gold-shadow)}
.ar-desc{color:#aaa;font-size:.95rem;border-right:3px solid var(--gold);padding-right:12px;display:block;margin-top:5px}

.btn-gold{display:block;width:100%;padding:20px;background:linear-gradient(45deg,var(--gold-dark),var(--gold));color:#000;text-decoration:none;font-weight:900;border-radius:18px;margin-top:30px;transition:.4s;text-transform:uppercase;box-shadow:0 5px 15px var(--gold-shadow)}
.btn-gold:hover{transform:translateY(-5px);box-shadow:0 10px 25px var(--gold)}
.insta-link{color:#888;text-decoration:none;font-size:.85rem;display:block;margin-top:20px;transition:.3s}
.insta-link:hover{color:var(--gold);text-shadow:0 0 8px var(--gold)}
</style>
