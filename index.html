<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nasr | Portfolio</title>
  <style>
    :root {
      --primary: #00d2ff;
      --secondary: #3a7bd5;
      --bg-dark: #050a14;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: white;
      text-align: center;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }

    /* تأثير الخطوط الوميضية المتحركة في الخلفية */
    .bg-lines {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at center, #0a192f 0%, #050a14 100%);
    }

    .line {
      position: absolute;
      width: 2px;
      height: 100vh;
      background: linear-gradient(to bottom, transparent, var(--primary), transparent);
      opacity: 0;
      animation: scan linear infinite;
    }

    @keyframes scan {
      0% { transform: translateY(-100%); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(100%); opacity: 0; }
    }

    .line:nth-child(1) { left: 15%; animation-duration: 3s; background: #00d2ff; }
    .line:nth-child(2) { left: 35%; animation-duration: 5s; animation-delay: 1s; background: #ff007a; }
    .line:nth-child(3) { left: 55%; animation-duration: 4s; animation-delay: 2s; background: #00ff88; }
    .line:nth-child(4) { left: 75%; animation-duration: 6s; animation-delay: 0.5s; background: #7000ff; }
    .line:nth-child(5) { left: 95%; animation-duration: 3.5s; animation-delay: 1.5s; background: #ffee00; }

    /* شاشة التحميل */
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--bg-dark);
      display: flex;
      align-items: center; justify-content: center;
      z-index: 9999;
      transition: 0.8s;
    }

    .spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(0, 210, 255, 0.1);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .container { padding: 40px 20px; max-width: 500px; margin: auto; }

    h1 {
      font-size: 4.5rem;
      margin: 0;
      letter-spacing: 10px;
      text-transform: uppercase;
      background: linear-gradient(to bottom, #fff, #666);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));
    }

    .subtitle {
      color: var(--primary);
      font-weight: bold;
      margin-bottom: 40px;
      font-size: 0.85rem;
      letter-spacing: 2px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 25px;
      backdrop-filter: blur(8px);
      text-align: left;
    }

    .card h3 { color: var(--primary); margin-top: 0; margin-bottom: 15px; font-size: 1.2rem; }
    .card p { margin: 8px 0; font-size: 0.95rem; color: #cbd5e1; }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 12px;
      transition: 0.3s;
      box-shadow: 0 8px 20px rgba(0, 210, 255, 0.2);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:hover { background: #fff; transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0, 210, 255, 0.4); }

    .footer { margin-top: 40px; font-size: 0.65rem; color: #444; letter-spacing: 1px; }
  </style>
</head>
<body>

  <div id="loader"><div class="spinner"></div></div>

  <div class="bg-lines">
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
  </div>

  <div class="container">
    <h1>Nasr</h1>
    <div class="subtitle">PYTHON DEVELOPER • CYBER SECURITY EXPERT</div>

    <div class="card">
      <h3>Expertise</h3>
      <p>• Python Automation & Advanced Bots</p>
      <p>• Social Media Security (Insta, FB, X, TikTok)</p>
      <p>• Advanced Cyber Protection Solutions</p>
    </div>

    <a href="https://t.me/nasrout" class="btn" target="_blank">Message Me on Telegram</a>

    <div class="footer">SECURED SYSTEM BY NASR © 2026</div>
  </div>

  <script>
    window.onload = () => {
      document.getElementById("loader").style.opacity = "0";
      setTimeout(() => { document.getElementById("loader").style.display = "none"; }, 800);
    }
  </script>
</body>
</html>
