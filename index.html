<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نصر | Nasr</title>  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
      text-align:center;
    }

    /* شاشة تحميل */
    #loader{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:#0f172a;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
      flex-direction:column;
    }

    .spinner{
      width:60px;
      height:60px;
      border:5px solid #334155;
      border-top:5px solid #38bdf8;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      0%{transform:rotate(0deg)}
      100%{transform:rotate(360deg)}
    }

    nav{
      position:sticky;
      top:0;
      background:rgba(0,0,0,0.3);
      backdrop-filter:blur(10px);
      padding:12px;
      display:flex;
      justify-content:center;
      gap:20px;
      z-index:100;
    }

    nav a{
      color:white;
      text-decoration:none;
      font-weight:bold;
    }

    .box{
      padding:60px 20px;
      animation:fadeIn 1s ease-in;
    }

    .card{
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.12);
      padding:20px;
      margin:20px auto;
      border-radius:18px;
      max-width:420px;
      backdrop-filter:blur(12px);
      box-shadow:0 8px 25px rgba(0,0,0,0.3);
      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.03);
    }

    /* صورة شخصية احترافية مطوّرة */
    .profile-img{
      width:160px;
      height:160px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid transparent;
      background:linear-gradient(135deg,#38bdf8,#0ea5e9);
      padding:4px;
      margin:auto;
      display:block;
      transition:0.4s;
      box-shadow:0 15px 35px rgba(0,0,0,0.5);
      animation:float 3s ease-in-out infinite;
    }

    .profile-img:hover{
      transform:scale(1.15);
      box-shadow:0 20px 45px rgba(56,189,248,0.4);
    }

    @keyframes float{
      0%{transform:translateY(0px)}
      50%{transform:translateY(-8px)}
      100%{transform:translateY(0px)}
    }

    h1{
      margin:15px 0;
      font-size:42px;
    }

    .btn{
      display:inline-block;
      margin-top:10px;
      padding:10px 20px;
      background:#38bdf8;
      color:#0f172a;
      border-radius:20px;
      text-decoration:none;
      font-weight:bold;
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.08);
      background:#0ea5e9;
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(-20px);}
      to{opacity:1; transform:translateY(0);}
    }
  </style></head><body><!-- شاشة تحميل --><div id="loader">
  <div class="spinner"></div>
  <p>جاري التحميل...</p>
</div><nav>
  <a href="#home">الرئيسية</a>
  <a href="#about">عنّي</a>
  <a href="#projects">مشاريعي</a>
  <a href="#contact">تواصل</a>
</nav><div class="box" id="home">  <!-- 🔴 ضع رابط صورتك هنا بعد رفعها على GitHub -->  <img class="profile-img" src="https://via.placeholder.com/150" alt="صورة شخصية">  <h1>نصر | Nasr</h1>
  <p>مطور برمجيات 💻 | Software Developer</p>  <div class="card" id="about">
    <p>
      I build modern websites and user interfaces.<br>
      أبني مواقع وواجهات حديثة باستخدام تقنيات الويب.
    </p>
  </div>  <div class="card" id="projects">
    <h3>مشاريعي | Projects</h3>
    <p>🌐 موقع تعريفي</p>
    <p>📱 واجهات ويب حديثة</p>
    <p>⚙️ مشاريع JavaScript</p>
  </div>  <div class="card" id="contact">
    <p>📱 حسابي: @nasrout</p>
    <a class="btn" href="https://t.me/nasrout" target="_blank">تليگرام</a>
  </div></div><script>
  window.onload = function(){
    document.getElementById("loader").style.display = "none";
  }
</script></body>
  </html>
